services:
  postgres:
    image: postgres:16-alpine
    container_name: keystone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone_dev_pw
      POSTGRES_DB: keystone
    ports:
      - "5432:5432"
    # pg_stat_statements is the per-query counter — needed to prove the
    # singleflight defense (count SELECTs on resolve). Harmless always-on.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - keystone_pgdata:/var/lib/postgresql/data
      - ./origin/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: keystone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    container_name: keystone-k6
    working_dir: /wd
    volumes:
      - ./loadtest:/wd
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8787}

volumes:
  keystone_pgdata:
