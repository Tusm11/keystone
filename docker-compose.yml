# Local dev infrastructure for Keystone.
#
# Modes:
#  1. Dev (default)  — postgres + redis; origin runs natively (go run)
#  2. Scale          — docker compose --profile scale up -d --scale origin=3
#                      origin + lb + clickworker in Docker
#  3. Observability  — docker compose --profile scale --profile observe up -d
#                      adds Prometheus + Grafana scraping the fleet
#  4. Load tests     — docker compose --profile loadtest run --rm k6 run ...

services:
  postgres:
    image: postgres:16-alpine
    container_name: keystone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone_dev_pw
      POSTGRES_DB: keystone
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - keystone_pgdata:/var/lib/postgresql/data
      - ./origin/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: keystone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- scale profile ---

  origin:
    profiles: ["scale"]
    build:
      context: ./origin
    environment:
      ORIGIN_ADDR: ":8080"
      DATABASE_URL: postgres://keystone:keystone_dev_pw@postgres:5432/keystone
      REDIS_URL: redis://redis:6379/0
      KEYSTONE_SIGNING_PRIVATE_KEY: ${KEYSTONE_SIGNING_PRIVATE_KEY:-}
      KEYSTONE_SIGNER_ID: ${KEYSTONE_SIGNER_ID:-}
      KEYSTONE_RL_SHORTEN: ${KEYSTONE_RL_SHORTEN:-60}
      KEYSTONE_RL_CAPABILITIES: ${KEYSTONE_RL_CAPABILITIES:-30}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  clickworker:
    profiles: ["scale"]
    build:
      context: ./origin
    container_name: keystone-clickworker
    entrypoint: ["/usr/local/bin/clickworker"]
    environment:
      DATABASE_URL: postgres://keystone:keystone_dev_pw@postgres:5432/keystone
      REDIS_URL: redis://redis:6379/0
      CLICKWORKER_METRICS_ADDR: ":8081"
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lb:
    profiles: ["scale"]
    image: nginx:1.27-alpine
    container_name: keystone-lb
    volumes:
      - ./infra/lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:8090"
    depends_on:
      - origin

  # --- observability profile ---

  prometheus:
    profiles: ["observe"]
    image: prom/prometheus:v2.54.1
    container_name: keystone-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observe"]
    image: grafana/grafana:11.2.2
    container_name: keystone-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # --- loadtest profile ---

  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    container_name: keystone-k6
    working_dir: /wd
    volumes:
      - ./loadtest:/wd
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8787}

volumes:
  keystone_pgdata:
  prometheus_data:
  grafana_data:
