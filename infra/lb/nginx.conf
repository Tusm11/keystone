# Keystone load balancer config.
#
# The upstream resolves `origin` through Docker's embedded DNS (127.0.0.11).
# When origin is scaled with `docker compose up --scale origin=N`, Docker
# returns multiple A records. Without the `resolver` directive, nginx
# caches the first resolution forever and never notices new replicas.
#
# What this teaches:
#   - least_conn vs round-robin: least_conn routes to the replica with
#     the fewest in-flight requests. For URL-shortener-ish workloads with
#     uniform cost per request, round-robin would be equivalent; we use
#     least_conn because it degrades more gracefully when one replica is
#     momentarily slower.
#   - Health awareness via max_fails + fail_timeout: if an upstream fails
#     3 times in 10s, nginx takes it out of rotation for 10s.
#   - Explicit timeouts: analogous to the Go http.Server timeouts.

events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS; valid=5s makes nginx re-resolve every 5s so
    # scaled-up replicas join rotation without a reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream origin_pool {
        least_conn;
        # `server` with a variable forces runtime resolution.
        # The `resolve` keyword is nginx-plus only; the workaround on OSS
        # nginx is to use a variable and set_from_var in `proxy_pass`.
        # Instead we use `server <hostname>` directly which, with the
        # resolver above, is re-resolved periodically on recent OSS nginx.
        server origin:8080 max_fails=3 fail_timeout=10s;
    }

    log_format upstream '[$time_local] $status $upstream_addr $upstream_response_time '
                       '"$request" rt=$request_time';
    access_log /var/log/nginx/access.log upstream;

    server {
        listen 8090;

        # Timeouts: fail fast rather than piling connections on a slow backend.
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    10s;

        # Retry on connection error or 502 — covers the "replica just died"
        # window before health check kicks it out.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        location / {
            proxy_pass http://origin_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
