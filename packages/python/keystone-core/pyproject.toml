[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keystone-core"
version = "0.1.0"
description = "Signed capability tokens and short-code primitives for Keystone — the Python port of the v1 wire-format spec."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Abhiram", email = "ab542v@gmail.com" }]
keywords = ["url-shortener", "capability", "ed25519", "signed-tokens", "agent-infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Tusm11/keystone"
Issues = "https://github.com/Tusm11/keystone/issues"
Source = "https://github.com/Tusm11/keystone"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
